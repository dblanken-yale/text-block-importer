name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  COVERAGE: true
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    strategy:
      matrix:
        ruby-version: ['3.2']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils curl

    - name: Create necessary directories
      run: |
        mkdir -p tmp
        mkdir -p log
        mkdir -p coverage

    - name: Install dependencies
      run: |
        bundle install --jobs 4 --retry 3

    - name: Verify dependencies
      run: bundle exec rake verify:deps

    # - name: Run linter
    #   run: bundle exec rubocop --display-cop-names

    - name: Debug environment and SimpleCov
      run: |
        echo "Environment variables:"
        echo "COVERAGE=$COVERAGE"
        echo "CI=$CI"
        echo "Ruby version: $(ruby --version)"
        echo "SimpleCov gem installed:"
        bundle list | grep simplecov || echo "SimpleCov not found"
        echo "Testing SimpleCov require:"
        ruby -e "require 'simplecov'; puts 'SimpleCov loaded successfully'" || echo "Failed to load SimpleCov"
        echo "Testing SimpleCov start:"
        ruby -e "
          ENV['COVERAGE'] = 'true'
          ENV['CI'] = 'true'
          require 'simplecov'
          SimpleCov.start do
            add_filter '/spec/'
          end
          puts 'SimpleCov started successfully'
          puts 'Coverage dir: ' + SimpleCov.coverage_dir
        " || echo "Failed to start SimpleCov"

    - name: Create minimal SimpleCov test
      run: |
        echo "Creating minimal coverage test..."
        cat > minimal_coverage_test.rb << 'EOF'
        require 'simplecov'
        SimpleCov.start do
          add_filter '/spec/'
          formatter SimpleCov::Formatter::HTMLFormatter
        end
        
        # Require our main library to get some coverage
        require_relative 'lib/text_block_importer'
        
        # Create some dummy coverage
        config = TextBlockImporter::Config.new
        puts "Config created: #{config.class}"
        EOF
        
        ruby minimal_coverage_test.rb
        echo "After minimal test:"
        ls -la
        ls -la coverage/ || echo "No coverage directory"

    - name: Run full test suite with coverage
      run: |
        echo "Starting test suite with coverage..."
        echo "Current directory contents:"
        ls -la
        echo "Spec helper check:"
        head -10 spec/spec_helper.rb
        echo "Running tests with explicit env vars..."
        COVERAGE=true CI=true bundle exec rspec --format progress
        echo "Test suite completed, exit code: $?"
        echo "Current directory after tests:"
        ls -la
        echo "Checking for any coverage-related files:"
        find . -name "*.json" -o -name "coverage*" -o -name ".resultset*" | head -10
      
    - name: Verify coverage files were generated
      run: |
        echo "Checking for coverage files..."
        ls -la coverage/ || echo "Coverage directory not found"
        if [ -f "coverage/index.html" ]; then
          echo "✅ Coverage HTML report generated"
        else
          echo "❌ Coverage HTML report missing"
        fi
        if [ -f "coverage/.resultset.json" ]; then
          echo "✅ Coverage JSON data found"
          echo "File size: $(wc -c < coverage/.resultset.json) bytes"
        else
          echo "❌ Coverage JSON data missing"
        fi

    - name: Generate coverage summary
      run: |
        if [ -f coverage/.resultset.json ]; then
          # Extract coverage percentage from SimpleCov resultset
          echo "COVERAGE_PERCENT=$(ruby -rjson -e "
            data = JSON.parse(File.read('coverage/.resultset.json'))
            if data['RSpec']
              total_lines = data['RSpec']['coverage'].values.flatten.select { |x| x.is_a?(Integer) }.sum
              covered_lines = data['RSpec']['coverage'].values.flatten.select { |x| x.is_a?(Integer) && x > 0 }.sum
              percent = total_lines > 0 ? (covered_lines.to_f / total_lines * 100).round(2) : 0
              puts percent
            else
              puts 'N/A'
            end
          ")" >> $GITHUB_ENV
        fi

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = process.env.COVERAGE_PERCENT;
          if (coverage) {
            const body = `## 📊 Coverage Report
            
            **Line Coverage:** ${coverage}%
            
            📋 [Download detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (check artifacts section)
            
            💡 *Coverage report includes detailed line-by-line analysis*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.ruby-version }}
        path: coverage/
        if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    
    - name: Run Bundler Audit
      run: |
        gem install bundler-audit
        bundle audit --update

