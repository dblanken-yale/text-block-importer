<!DOCTYPE html>
<html lang="en">
<head>
  <title>Page with Quotes and Special Characters</title>
</head>
<body>
  <h1>Test Page with 'Single Quotes' and "Double Quotes"</h1>
  
  <div class="content-main">
    <p>This paragraph contains 'single quotes' and "double quotes".</p>
    <p>It also has some special characters: &amp; &lt; &gt; &nbsp;</p>
    <p>And some Unicode: café, naïve, résumé</p>
    
    <blockquote cite="https://example.com">
      "This is a quoted passage with 'nested quotes' inside."
    </blockquote>
    
    <code>var message = 'Hello, world!';</code>
  </div>
</body>
</html>
